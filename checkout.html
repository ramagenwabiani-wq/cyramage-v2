<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | CyRamage</title>

    <link rel="stylesheet" href="css/style.css?v=10">

    <style>
        body {
            margin: 0;
            background: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .checkout-page {
            width: min(900px, 90%);
            margin: 60px auto;
        }

        .checkout-page h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        .checkout-box {
            background: #171717;
            border: 1px solid #3b321c;
            border-radius: 12px;
            padding: 30px;
        }

        .checkout-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 0;
            border-bottom: 1px solid #333333;
        }

        .checkout-total {
            color: #d4af37;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .payment-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 25px;
            padding: 16px;
            border: 0;
            border-radius: 8px;
            background: #d4af37;
            color: #080808;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .payment-button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #d4af37;
            text-decoration: none;
        }

        .checkout-header {
            width: 100%;
            padding: 24px 0;
            text-align: center;
            border-bottom: 1px solid #262626;
        }

        .checkout-header img {
            height: 48px;
            width: auto;
        }
    </style>
</head>

<body>

<header class="checkout-header">
    <a href="index.html#home">
        <img src="images/logo.png" alt="CyRamage Logo">
    </a>
</header>

<main class="checkout-page">
    <h1>Secure Checkout</h1>

    <section class="checkout-box">
        <h2>Your Order</h2>

        <div id="checkoutItems"></div>

        <div class="checkout-row checkout-total">
            <span>Total</span>
            <span id="checkoutTotal">£0.00</span>
        </div>

       <button
    type="button"
    class="payment-button"
    id="paymentButton"
>
    Pay Securely with Stripe
</button>

        <a href="cart.html" class="back-link">
            ← Return to shopping bag
        </a>
    </section>
</main>

<script>
    const CART_KEY = "cyramageCart";

    const checkoutItems =
        document.getElementById("checkoutItems");

    const checkoutTotal =
        document.getElementById("checkoutTotal");

   let cart = [];

try {
    const urlParameters =
        new URLSearchParams(window.location.search);

    const cartFromUrl =
        urlParameters.get("cart");

    const savedCart =
        cartFromUrl
            ? decodeURIComponent(cartFromUrl)
            : localStorage.getItem("cyramageCart") ||
              localStorage.getItem("cart") ||
              "[]";

    const parsedCart = JSON.parse(savedCart);

    cart = Array.isArray(parsedCart)
        ? parsedCart
        : [];

    localStorage.setItem(
        "cyramageCart",
        JSON.stringify(cart)
    );
} catch (error) {
    console.error(
        "Unable to read checkout cart:",
        error
    );

    cart = [];
}

    let orderTotal = 0;

    if (cart.length === 0) {
        checkoutItems.innerHTML = `
            <p>Your shopping bag is empty.</p>
        `;
    } else {
        cart.forEach((item) => {
            const price = Number(item.price) || 0;
            const quantity = Number(item.quantity) || 1;
            const lineTotal = price * quantity;

            orderTotal += lineTotal;

            checkoutItems.innerHTML += `
                <div class="checkout-row">
                    <span>
                        ${item.name} × ${quantity}
                    </span>

                    <span>
                        £${lineTotal.toFixed(2)}
                    </span>
                </div>
            `;
        });
    }

    checkoutTotal.textContent =
        `£${orderTotal.toFixed(2)}`;

    const paymentButton =
        document.getElementById("paymentButton");

    const WORKER_URL =
        "https://cyramage-stripe-checkout.ramage-nwabiani.workers.dev/create-checkout-session";

    paymentButton.addEventListener("click", async function () {
        if (!Array.isArray(cart) || cart.length === 0) {
            alert("Your shopping bag is empty.");
            return;
        }

        paymentButton.disabled = true;
        paymentButton.textContent = "Opening secure payment...";

        try {
            const items = cart.map((item) => ({
                id: item.id,
                quantity: Number(item.quantity) || 1
            }));

            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ items })
            });

            const data = await response.json();

            if (!response.ok || !data.url) {
                throw new Error(
                    data.error || "Unable to open Stripe Checkout."
                );
            }

            window.location.href = data.url;
        } catch (error) {
            console.error("Stripe checkout error:", error);

            alert(
                error.message ||
                "Unable to start payment. Please try again."
            );

            paymentButton.disabled = false;
            paymentButton.textContent = "Pay Securely with Stripe";
        }
    });
</script>

</body>
</html>
